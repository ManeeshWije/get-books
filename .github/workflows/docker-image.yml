name: Docker Build And Push
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build OCI image with Nix
        run: nix build .#dockerImage

      - name: Load image into Docker daemon
        run: nix run .#dockerImage.copyToDockerDaemon

      - name: Push image tags
        if: github.event_name == 'push'
        run: |
          docker tag maneeshwije/get-books:latest maneeshwije/get-books:${{ github.sha }}
          docker push maneeshwije/get-books:latest
          docker push maneeshwije/get-books:${{ github.sha }}
