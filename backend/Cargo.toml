[package]
name = "get-books"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7.9"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
futures-util = "0.3.30"
tower-http = { version = "0.5.2", features = ["full"] }
dotenv = "0.15.0"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
http = "1.3.1"
redis = { version = "1.2.1", features = ["r2d2"] }
r2d2 = "0.8.10"
reqwest = { version = "0.13", features = ["json"] }
typeshare = "1.0.0"
anyhow = "1.0.102"
tiny_id = "0.1.6"
chrono = "0.4.44"
serde_json = "1.0.149"
tokio-util = "0.7.18"
